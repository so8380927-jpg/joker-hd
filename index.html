<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOKER HD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f1016; color: #ffffff; direction: rtl; overflow: hidden; }
        .screen { display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; background-color: #0f1016; justify-content: center; align-items: center; flex-direction: column; }
        .screen.active { display: flex; }
        .card { background: #1e1e24; padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
        .logo { font-size: 2.5rem; font-weight: bold; color: #fbc531; margin-bottom: 10px; }
        .subtitle { font-size: 0.9rem; color: #718093; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; background: #2f3640; border: 1px solid #485460; border-radius: 8px; color: #fff; font-size: 1rem; text-align: center; }
        input:focus { border-color: #fbc531; outline: none; }
        button { width: 100%; padding: 12px; background: #009432; border: none; border-radius: 8px; color: white; font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.3s; }
        button:hover { opacity: 0.9; }
        button.secondary { background: transparent; border: 1px solid #485460; color: #dcdde1; }
        .error-box { color: #e84118; font-size: 0.9rem; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

    <!-- شاشة البداية -->
    <div id="loginPage" class="screen active">
        <div class="card">
            <div class="logo">JOKER HD</div>
            <div class="subtitle">أهلاً بك في التطبيق</div>
            <button id="goToCodeBtn">لديك كود VIP؟ تفعيل الاشتراك</button>
            <button id="visitorBtn" class="secondary">الدخول كزائر</button>
        </div>
    </div>

    <!-- شاشة إدخال الكود -->
    <div id="codePage" class="screen">
        <div class="card">
            <div class="logo">تفعيل الكود</div>
            <div class="subtitle" style="color: #fbc531;">الرجاء إدخال كود الاشتراك الخاص بك</div>
            <div id="codeError" class="error-box"></div>
            <input type="text" id="vipCode" placeholder="أدخل الكود هنا" style="text-transform: uppercase;">
            <button id="activateCodeBtn">تفعيل الاشتراك</button>
            <button id="backToLoginBtn" class="secondary">رجوع</button>
        </div>
    </div>

    <!-- الشاشة الرئيسية للتطبيق -->
    <div id="homePage" class="screen">
        <div class="card">
            <div class="logo">JOKER HD</div>
            <div class="subtitle" style="color: #4cd137;">تم تفعيل الحساب بنجاح! 🎉</div>
            <p style="margin-bottom: 20px;">مرحباً بك في لوحة التحكم الرئيسية الخاصة بك.</p>
            <button id="logoutBtn" class="secondary">تسجيل الخروج</button>
        </div>
    </div>

    <script type="module">
        // استيراد مكتبات فايربيس
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // إعدادات قاعدة البيانات الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyAdAQ49EIcldflX-Am5tk0NHJUur0ewXVE",
            authDomain: "jokeerhd-64542.firebaseapp.com",
            projectId: "jokeerhd-64542",
            storageBucket: "jokeerhd-64542.firebasestorage.app",
            messagingSenderId: "950615684006",
            appId: "1:950615684006:web:0bf6a3c2044da1c4f61567"
        };

        // تهيئة فايربيس
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);// تعريف الشاشات
        const loginPage = document.getElementById("loginPage");
        const codePage = document.getElementById("codePage");
        const homePage = document.getElementById("homePage");

        // التنقل بين الشاشات
        document.getElementById("goToCodeBtn").addEventListener("click", () => {
            loginPage.classList.remove("active");
            codePage.classList.add("active");
        });

        document.getElementById("backToLoginBtn").addEventListener("click", () => {
            codePage.classList.remove("active");
            loginPage.classList.add("active");
        });

        document.getElementById("visitorBtn").addEventListener("click", () => {
            loginPage.classList.remove("active");
            homePage.classList.add("active");
        });

        document.getElementById("logoutBtn").addEventListener("click", () => {
            homePage.classList.remove("active");
            loginPage.classList.add("active");
        });

        // تفعيل كود الـ VIP والتحقق من قاعدة البيانات
        document.getElementById("activateCodeBtn").addEventListener("click", async () => {
            const codeInput = document.getElementById("vipCode");
            const codeText = codeInput.value.trim().toUpperCase(); // يحول الحروف إلى كبيرة تلقائياً
            const errBox = document.getElementById("codeError");
            const btn = document.getElementById("activateCodeBtn");

            if (!codeText) {
                errBox.style.display = "block";
                errBox.innerText = "الرجاء إدخال كود الاشتراك";
                return;
            }

            btn.disabled = true;
            btn.innerText = "جاري التحقق...";
            errBox.style.display = "none";

            try {
                // البحث عن الكود في قاعدة البيانات
                const q = query(
                    collection(db, "vip_codes"),
                    where("code", "==", codeText)
                );

                const result = await getDocs(q);

                if (!result.empty) {
                    const codeDoc = result.docs[0];
                    const codeData = codeDoc.data();

                    // التحقق مما إذا كان الكود غير فعال أو مستخدم
                    if (codeData.active === false) {
                        errBox.style.display = "block";
                        errBox.innerText = "عذراً، هذا الكود غير فعال.";
                    } else if (codeData.used === true) {
                        errBox.style.display = "block";
                        errBox.innerText = "عذراً، هذا الكود مستخدم مسبقاً!";
                    } else {
                        // الكود صالح! نقوم بتحديث حالته ليصبح مستخدماً
                        await updateDoc(doc(db, "vip_codes", codeDoc.id), {
                            used: true
                        });

                        alert("تم تفعيل الكود بنجاح! مرحباً بك في VIP");
                        
                        // إخفاء صفحة الكود وإظهار الصفحة الرئيسية
                        codePage.classList.remove("active");
                        homePage.classList.add("active");
                    }
                } else {
                    errBox.style.display = "block";
                    errBox.innerText = "الكود غير صحيح، تأكد من كتابته بشكل سليم.";
                }
            } catch (error) {
                console.error("Firebase Error:", error);
                errBox.style.display = "block";
                errBox.innerText = "حدث خطأ أثناء الاتصال. يرجى المحاولة لاحقاً.";
            } finally {
                btn.disabled = false;
                btn.innerText = "تفعيل الاشتراك";
            }
        });
    </script>
</body>
</html>
